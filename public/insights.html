<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkers Insights | News & Facts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#151e2e',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        teal: {
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Ambient Background Elements for Glassmorphism Context */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #020617;
        }
        .ambient-blob-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(20,184,166,0.15) 0%, rgba(2,6,23,0) 70%);
            border-radius: 50%;
            filter: blur(60px);
        }
        .ambient-blob-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(51,65,85,0.4) 0%, rgba(2,6,23,0) 70%);
            border-radius: 50%;
            filter: blur(80px);
        }

        /* Glassmorphism Utilities */
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(45, 212, 191, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border-radius: 1rem;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        .glass-card:hover {
            transform: translateY(-2px);
            border-color: rgba(45, 212, 191, 0.4);
            box-shadow: 0 8px 30px rgba(45, 212, 191, 0.05);
        }

        .glass-card-history {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(51, 65, 85, 0.5);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .glass-card-history:hover {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(45, 212, 191, 0.3);
        }

        .glass-button {
            background: rgba(45, 212, 191, 0.1);
            border: 1px solid rgba(45, 212, 191, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .glass-button:hover {
            background: rgba(45, 212, 191, 0.2);
            border-color: rgba(45, 212, 191, 0.4);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative">
    <!-- Ambient Background -->
    <div class="ambient-bg">
        <div class="ambient-blob-1"></div>
        <div class="ambient-blob-2"></div>
    </div>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-3xl relative z-10">
        <!-- Header -->
        <header class="mb-12 text-center relative">
            <h1 class="relative z-20 text-4xl md:text-5xl font-bold mb-4 pb-2 bg-clip-text text-transparent bg-gradient-to-r from-teal-400 to-slate-200 tracking-tight leading-normal md:leading-normal">
                Checkers Insights
            </h1>
            <p class="relative z-10 text-slate-400 text-lg">Curated news and fascinating facts from the world of checkers.</p>
        </header>

        <!-- Current Insights Section -->
        <section id="current-insights" class="mb-12">
            <div class="flex justify-between items-end mb-6">
                <h2 class="text-2xl font-semibold text-slate-200 tracking-wide">Latest Insights</h2>
                <button id="fetch-btn" onclick="handleFetchMore()" class="glass-button text-teal-400 hover:text-teal-300 text-sm font-medium px-5 py-2.5 rounded-lg transition-colors flex items-center gap-2 cursor-pointer shadow-lg">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span>Fetch New</span>
                </button>
            </div>
            <div id="current-list" class="space-y-4">
                <!-- Cards will be injected here via JavaScript -->
            </div>
        </section>

        <!-- History Section -->
        <section id="history-section" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-slate-400 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    History
                </h2>
                <button onclick="clearHistory()" class="text-slate-500 hover:text-rose-400 text-sm font-medium transition-colors cursor-pointer">
                    Clear History
                </button>
            </div>
            <div id="history-list" class="space-y-3">
                <!-- History items will be injected here via JavaScript -->
            </div>
        </section>
    </main>

    <!-- Custom Toast Message (replaces default alert) -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 border border-teal-500/30 text-teal-300 px-6 py-3 rounded-lg shadow-lg transform transition-transform translate-y-24 opacity-0 z-50 flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="toast-message">Notification</span>
    </div>

    <script>
        const STORAGE_KEY_HISTORY = "checkers_insights_history_v4";
        const STORAGE_KEY_CURRENT = "checkers_insights_current_v4";

        let historyItems = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY)) || [];
        let currentItems = JSON.parse(localStorage.getItem(STORAGE_KEY_CURRENT)) || [];

        // Icons for cards
        const icons = {
            Fact: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>`,
            News: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>`,
            Research: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>`,
            Book: `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>`
        };

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 4000);
        }

        async function init() {
            if (currentItems.length === 0) {
                await handleFetchMore(true);
            } else {
                renderCurrent(currentItems);
                renderHistory(historyItems);
            }
        }

        async function fetchRealData() {
            try {
                // Switching to a dedicated RSS-to-JSON service and adding redundant trustworthy sources (Yahoo News & Crossref Academic Papers)
                const gNewsUrl = 'https://news.google.com/rss/search?q=checkers+OR+draughts+board+game&hl=en-US&gl=US&ceid=US:en';
                const yahooNewsUrl = 'https://news.search.yahoo.com/rss?p=checkers+OR+draughts+board+game';
                const rss2jsonBase = 'https://api.rss2json.com/v1/api.json?rss_url=';

                // Fetching from 5 diverse sources. We lowered Wikipedia's limit so it doesn't drown out the others.
                const [wikiRes, gNewsRes, yahooNewsRes, crossrefRes, bookRes] = await Promise.allSettled([
                    fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=draughts%20OR%20checkers%20board%20game&srlimit=15&format=json&origin=*'),
                    fetch(rss2jsonBase + encodeURIComponent(gNewsUrl)),
                    fetch(rss2jsonBase + encodeURIComponent(yahooNewsUrl)),
                    fetch('https://api.crossref.org/works?query=checkers+board+game+draughts&select=title,URL&rows=15'),
                    fetch('https://openlibrary.org/search.json?q=subject:checkers+game&limit=10')
                ]);

                let combinedData = [];

                // 1. Process Wikipedia Data (Facts)
                if (wikiRes.status === 'fulfilled' && wikiRes.value.ok) {
                    const wikiData = await wikiRes.value.json();
                    const mappedWiki = wikiData.query.search.map(item => ({
                        id: 'wiki_' + item.pageid.toString(),
                        type: "Fact", 
                        title: item.snippet.replace(/<\/?[^>]+(>|$)/g, "") + "...", // Clean HTML tags
                        url: `https://en.wikipedia.org/?curid=${item.pageid}`
                    }));
                    combinedData = [...combinedData, ...mappedWiki];
                }

                // 2. Process Google News via rss2json API
                if (gNewsRes.status === 'fulfilled' && gNewsRes.value.ok) {
                    const newsData = await gNewsRes.value.json();
                    if (newsData.items) {
                        const mappedGNews = newsData.items.map(item => ({
                            id: 'gnews_' + item.link.replace(/[^a-zA-Z0-9]/g, '').substring(0, 30),
                            type: "News",
                            title: item.title,
                            url: item.link
                        }));
                        combinedData = [...combinedData, ...mappedGNews];
                    }
                }

                // 3. Process Yahoo News via rss2json API (Reliable fallback for News)
                if (yahooNewsRes.status === 'fulfilled' && yahooNewsRes.value.ok) {
                    const yNewsData = await yahooNewsRes.value.json();
                    if (yNewsData.items) {
                        const mappedYNews = yNewsData.items.map(item => ({
                            id: 'ynews_' + item.link.replace(/[^a-zA-Z0-9]/g, '').substring(0, 30),
                            type: "News",
                            title: item.title,
                            url: item.link
                        }));
                        combinedData = [...combinedData, ...mappedYNews];
                    }
                }

                // 4. Process Crossref Academic Papers (Trustworthy Research)
                if (crossrefRes.status === 'fulfilled' && crossrefRes.value.ok) {
                    const crossData = await crossrefRes.value.json();
                    if (crossData.message && crossData.message.items) {
                        const mappedResearch = crossData.message.items
                            .filter(item => item.title && item.URL)
                            .map(item => ({
                                id: 'research_' + item.URL.replace(/[^a-zA-Z0-9]/g, '').substring(0, 30),
                                type: "Research",
                                title: item.title[0],
                                url: item.URL
                            }));
                        combinedData = [...combinedData, ...mappedResearch];
                    }
                }

                // 5. Process OpenLibrary (Books)
                if (bookRes.status === 'fulfilled' && bookRes.value.ok) {
                    const bookData = await bookRes.value.json();
                    if (bookData.docs) {
                        const mappedBooks = bookData.docs.filter(doc => doc.title).map(doc => ({
                            id: 'book_' + doc.key.replace(/[^a-zA-Z0-9]/g, ''),
                            type: "Book",
                            title: doc.title + (doc.author_name ? ` by ${doc.author_name[0]}` : ''),
                            url: `https://openlibrary.org${doc.key}`
                        }));
                        combinedData = [...combinedData, ...mappedBooks];
                    }
                }
                
                // Filter out any exact title duplicates that might span across APIs
                const uniqueTitles = new Set();
                combinedData = combinedData.filter(item => {
                    if (uniqueTitles.has(item.title)) return false;
                    uniqueTitles.add(item.title);
                    return true;
                });

                if (combinedData.length === 0) throw new Error("No data fetched from any source.");

                return combinedData;
            } catch (error) {
                console.error("Failed to fetch real data:", error);
                showToast("Failed to connect to live data sources. Please try again.");
                return [];
            }
        }

        async function handleFetchMore(isInitial = false) {
            const btn = document.getElementById('fetch-btn');
            if (btn) {
                btn.disabled = true;
                btn.classList.add('opacity-75');
                btn.querySelector('span').innerText = 'Loading...';
            }

            // Append currently viewed items into the history section securely without duplicates
            if (!isInitial && currentItems.length > 0) {
                const historyIds = new Set(historyItems.map(item => item.id));
                currentItems.forEach(item => {
                    if (!historyIds.has(item.id)) {
                        historyItems.push(item);
                    }
                });
                localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(historyItems));
            }

            const livePool = await fetchRealData();
            
            if (btn) {
                btn.disabled = false;
                btn.classList.remove('opacity-75');
                btn.querySelector('span').innerText = 'Fetch New';
            }

            if (livePool.length === 0) return; // Silent return if fetch failed; error toast handled in fetchRealData()

            const historyIds = new Set(historyItems.map(item => item.id));
            let available = livePool.filter(item => !historyIds.has(item.id));
            
            // Loop back if user read through all available real insights
            if (available.length === 0) {
                showToast("You've read through all available insights today! Resetting history.");
                clearHistory(false);
                available = livePool; 
            }

            // --- DIVERSITY ALGORITHM: Force selection from different categories so Wikipedia doesn't dominate ---
            const categorized = {
                News: available.filter(i => i.type === 'News').sort(() => 0.5 - Math.random()),
                Research: available.filter(i => i.type === 'Research').sort(() => 0.5 - Math.random()),
                Book: available.filter(i => i.type === 'Book').sort(() => 0.5 - Math.random()),
                Fact: available.filter(i => i.type === 'Fact').sort(() => 0.5 - Math.random())
            };

            currentItems = [];

            // Pluck 1 from each category if they have it
            if (categorized.News.length > 0) currentItems.push(categorized.News.pop());
            if (categorized.Research.length > 0) currentItems.push(categorized.Research.pop());
            if (categorized.Book.length > 0) currentItems.push(categorized.Book.pop());
            
            // Pluck up to 2 facts
            if (categorized.Fact.length > 0) currentItems.push(categorized.Fact.pop());
            if (currentItems.length < 5 && categorized.Fact.length > 0) currentItems.push(categorized.Fact.pop());

            // If we still don't have 5 items, fill in the rest randomly from whatever is left
            const remaining = [...categorized.News, ...categorized.Research, ...categorized.Book, ...categorized.Fact].sort(() => 0.5 - Math.random());
            while (currentItems.length < 5 && remaining.length > 0) {
                currentItems.push(remaining.pop());
            }

            // Shuffle the final 5 so the visual order changes every time
            currentItems.sort(() => 0.5 - Math.random());
            
            localStorage.setItem(STORAGE_KEY_CURRENT, JSON.stringify(currentItems));
            
            renderCurrent(currentItems);
            renderHistory(historyItems);
        }

        function clearHistory(shouldReload = true) {
            localStorage.removeItem(STORAGE_KEY_HISTORY);
            localStorage.removeItem(STORAGE_KEY_CURRENT);
            historyItems = [];
            currentItems = [];
            // Optional reload check to avoid page refresh if clearing history programmatically
            if (shouldReload === true || typeof shouldReload !== 'boolean') {
                location.reload();
            }
        }

        function renderCurrent(items) {
            const container = document.getElementById('current-list');
            container.innerHTML = '';
            
            items.forEach(item => {
                let badgeClass = 'bg-slate-500/20 text-slate-300 border-slate-500/30';
                if (item.type === 'News') {
                    badgeClass = 'bg-teal-500/10 text-teal-400 border-teal-500/20';
                } else if (item.type === 'Research') {
                    badgeClass = 'bg-blue-500/10 text-blue-400 border-blue-500/20';
                } else if (item.type === 'Book') {
                    badgeClass = 'bg-purple-500/10 text-purple-400 border-purple-500/20';
                }
                
                const card = `
                    <a href="${item.url}" target="_blank" class="block glass-card p-5 md:p-6 group relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-r from-teal-500/0 to-teal-500/0 group-hover:from-teal-500/5 group-hover:to-transparent transition-all duration-300"></div>
                        <div class="flex items-start justify-between gap-4 relative z-10">
                            <div>
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold mb-3 border uppercase tracking-wider ${badgeClass}">
                                    ${icons[item.type] || icons['Fact']} ${item.type}
                                </span>
                                <h3 class="text-lg md:text-xl font-medium text-slate-100 group-hover:text-teal-300 transition-colors leading-snug">${item.title}</h3>
                            </div>
                            <div class="shrink-0 text-slate-600 group-hover:text-teal-400 transition-colors mt-1">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </div>
                        </div>
                    </a>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        function renderHistory(items) {
            const section = document.getElementById('history-section');
            const container = document.getElementById('history-list');
            container.innerHTML = '';
            
            if (items.length === 0) {
                section.classList.add('hidden');
                return;
            }
            
            section.classList.remove('hidden');
            
            const itemsToRender = [...items].reverse();
            
            itemsToRender.forEach(item => {
                let dotClass = 'bg-slate-500';
                if (item.type === 'News') dotClass = 'bg-teal-500';
                if (item.type === 'Research') dotClass = 'bg-blue-500';
                if (item.type === 'Book') dotClass = 'bg-purple-500';
                
                const card = `
                    <a href="${item.url}" target="_blank" class="block glass-card-history p-4 rounded-xl group">
                        <div class="flex items-center justify-between gap-4">
                            <div class="flex items-center gap-3 overflow-hidden">
                                <span class="shrink-0 w-2 h-2 rounded-full shadow-[0_0_8px_rgba(45,212,191,0.5)] ${dotClass}"></span>
                                <h4 class="text-sm md:text-base font-medium text-slate-300 group-hover:text-teal-300 transition-colors truncate">${item.title}</h4>
                            </div>
                            <div class="shrink-0 text-slate-600 group-hover:text-teal-500 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        </div>
                    </a>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
