<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Earth Screensaver</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030303;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        /* Full normal map container matching interactive mode */
        #map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            filter: contrast(1.25) saturate(1.3) brightness(0.78); /* Uniform darker cinematic grade */
        }

        /* Fix Leaflet default white background flash/box during tile loading */
        .leaflet-container {
            background-color: #030303 !important;
        }

        /* Uniform dark tint overlay across the entire screen */
        #dark-tint {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.35);
            z-index: 5;
            pointer-events: none;
        }

        /* Minimalist UI layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem;
            box-sizing: border-box;
        }

        .shadow-text {
            text-shadow: 0px 2px 12px rgba(0, 0, 0, 0.9), 0px 4px 24px rgba(0, 0, 0, 0.6);
        }

        .leaflet-control-container {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
    </div>
    <div id="dark-tint"></div>

    <div id="ui-layer">
        <!-- Top Row: Location Name (Left) & 12-Hour Live Clock (Right) -->
        <div class="flex justify-between items-start w-full">
            <div class="text-white">
                <h1 id="location-name" class="text-xs md:text-sm font-light tracking-widest shadow-text transition-opacity duration-500 opacity-0">
                    Loading global map overview...
                </h1>
            </div>
            <div class="text-white">
                <div id="live-clock" class="text-2xl md:text-4xl font-light tracking-wider shadow-text opacity-95">
                    12:00 AM
                </div>
            </div>
        </div>
        
        <!-- Bottom Center: Subtle instruction hint when user takes control -->
        <div class="flex justify-center items-end w-full">
            <div id="control-hint" class="text-white/60 text-xs md:text-sm tracking-widest shadow-text transition-opacity duration-500 opacity-0 bg-black/50 px-4 py-2 rounded-full backdrop-blur-sm">
                Explore Mode Active — Press [Spacebar] to Resume Screensaver
            </div>
        </div>
    </div>

    <script>
        const locations = [];
        // Curated safe regions excluding restricted countries (Russia, Venezuela, etc.)
        const regions = [
            { minLat: 25, maxLat: 50, minLng: -120, maxLng: -80, name: "North America" }, // USA / Canada
            { minLat: -30, maxLat: -15, minLng: -55, maxLng: -40, name: "South America" }, // Brazil
            { minLat: 40, maxLat: 54, minLng: -5, maxLng: 15, name: "Western Europe" }, // UK, France, Germany
            { minLat: -30, maxLat: -10, minLng: 125, maxLng: 150, name: "Australia" }, // Australia
            { minLat: 30, maxLat: 43, minLng: 130, maxLng: 142, name: "Japan" }, // Japan
            { minLat: 35, maxLat: 45, minLng: 10, maxLng: 25, name: "Southern Europe" } // Italy / Spain
        ];

        // Helper function to check if coordinate falls in restricted regions (Russia, Venezuela, etc.)
        function isRestrictedCoordinate(lat, lng) {
            // Russia rough bounding box check
            if (lat >= 41 && lat <= 82 && lng >= 19 && lng <= 180) return true;
            // Venezuela rough bounding box check
            if (lat >= 0.5 && lat <= 12.5 && lng >= -73.5 && lng <= -59.5) return true;
            return false;
        }

        // Procedurally populate over 250,000 unique, unrestricted high-detail coordinates
        for (let i = 0; i < 250000; i++) {
            const reg = regions[i % regions.length];
            const lat = reg.minLat + (Math.abs(Math.sin(i * 12.9898)) % 1) * (reg.maxLat - reg.minLat);
            const lng = reg.minLng + (Math.abs(Math.cos(i * 78.233)) % 1) * (reg.maxLng - reg.minLng);
            
            if (!isRestrictedCoordinate(lat, lng)) {
                locations.push({
                    lat: lat,
                    lng: lng,
                    zoom: 17 + (i % 3) // Close up high satellite detail
                });
            }
        }

        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            keyboard: false,
            dragging: true,
            scrollWheelZoom: true,
            doubleClickZoom: true,
            boxZoom: true,
            touchZoom: true,
            minZoom: 2,
            maxZoom: 20
        }).setView([20, 0], 2);

        // LAYER 1: Permanent Global Low-Res Background Layer (maxNativeZoom: 6)
        // Ensures the whole world map stays in memory and visible as a fallback over any black areas
        const baseLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            minZoom: 2,
            maxZoom: 20,
            maxNativeZoom: 6,
            noWrap: true,
            crossOrigin: true
        }).addTo(map);

        // LAYER 2: High-Resolution Detail Layer overlaid on top
        const detailLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            minZoom: 15,
            maxZoom: 20,
            noWrap: true,
            crossOrigin: true,
            keepBuffer: 16,
            updateWhenIdle: false,
            updateWhenZooming: false
        }).addTo(map);

        const locationNameEl = document.getElementById('location-name');
        const controlHintEl = document.getElementById('control-hint');
        const liveClockEl = document.getElementById('live-clock');

        let isUserControlling = false;
        let autoSwitchInterval;
        let animationFrameId;
        
        let baseLat = 0;
        let baseLng = 0;
        let currentZoom = 17;
        let driftTime = 0;
        let isTransitioning = false;
        let isFirstRun = true;

        // Request Screen Wake Lock to prevent sleep mode
        async function initWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    let wakeLock = await navigator.wakeLock.request('screen');
                    document.addEventListener('visibilitychange', async () => {
                        if (wakeLock !== null && document.visibilityState === 'visible') {
                            wakeLock = await navigator.wakeLock.request('screen');
                        }
                    });
                } catch (err) {
                    console.log("Wake Lock notice:", err);
                }
            }
        }

        // 12-Hour Live Clock updater with AM/PM
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // convert 0 to 12
            const minutes = String(now.getMinutes()).padStart(2, '0');
            liveClockEl.innerText = `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Method 2: Vertical Shifting / Fourier series base function f(x)
        function baseFunctionF(t) {
            return Math.sin(t * 0.35) * 0.0016 +
                   Math.sin(t * 0.85 + 1.4) * 0.0008 +
                   Math.sin(t * 1.65 + 2.8) * 0.0003;
        }

        async function fetchRealLocationName(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`, {
                    headers: { 'Accept-Language': 'en' }
                });
                const data = await response.json();
                if (data && data.address) {
                    const place = data.address.city || data.address.town || data.address.village || data.address.county || data.address.state || data.address.country;
                    const country = data.address.country;
                    if (place && country && place !== country) {
                        return `${place}, ${country}`;
                    } else if (place) {
                        return place;
                    } else if (country) {
                        return country;
                    }
                }
                if (data && data.display_name) {
                    const parts = data.display_name.split(',');
                    return `${parts[0].trim()}, ${parts[parts.length - 1].trim()}`;
                }
            } catch (e) {
                console.log("Geocoding notice:", e);
            }
            return null; // Return null if name cannot be loaded
        }

        function checkTileWashoutAndSkipIfNeeded() {
            if (isUserControlling) return;
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 150;
                canvas.height = 150;
                const ctx = canvas.getContext('2d');
                
                const tileImages = map.getContainer().querySelectorAll('.leaflet-tile-pane img');
                if (tileImages.length > 0) {
                    let washoutDetected = false;
                    
                    tileImages.forEach((img, idx) => {
                        if (idx < 6 && img.complete && img.naturalWidth > 0) {
                            ctx.clearRect(0, 0, 150, 150);
                            ctx.drawImage(img, 0, 0, 150, 150);
                            const imgData = ctx.getImageData(0, 0, 150, 150).data;
                            
                            let pureWhiteCount = 0;
                            let pureBlackCount = 0;
                            const totalPixels = imgData.length / 4;
                            
                            for (let i = 0; i < imgData.length; i += 4) {
                                if (imgData[i] > 240 && imgData[i+1] > 240 && imgData[i+2] > 240) {
                                    pureWhiteCount++;
                                }
                                if (imgData[i] < 12 && imgData[i+1] < 12 && imgData[i+2] < 12) {
                                    pureBlackCount++;
                                }
                            }
                            
                            // If over 40% is pure white (clouds/snow) or pure black (missing high-zoom data), skip
                            if ((pureWhiteCount / totalPixels) > 0.40 || (pureBlackCount / totalPixels) > 0.40) {
                                washoutDetected = true;
                            }
                        }
                    });
                    
                    if (washoutDetected) {
                        console.log("Unviewable black/white area detected. Skipping location...");
                        changeLocation();
                    }
                }
            } catch (err) {
                // Ignore cross-origin canvas security taint if triggered before tiles settle
            }
        }

        function smoothDriftLoop() {
            if (!isUserControlling && !isTransitioning) {
                driftTime += 0.003;

                // Method 2: y = f(x) + C curves separated by constant C
                const C_lat = 0.0;
                const C_lng = 2.4; // Constant phase separation C

                const dLat = baseFunctionF(driftTime + C_lat);
                const dLng = baseFunctionF(driftTime + C_lng) * 1.3;

                const targetLat = baseLat + dLat;
                const targetLng = baseLng + dLng;

                const currentCenter = map.getCenter();
                const currentPoint = map.project([currentCenter.lat, currentCenter.lng], map.getZoom());
                const targetPoint = map.project([targetLat, targetLng], map.getZoom());
                
                const dx = targetPoint.x - currentPoint.x;
                const dy = targetPoint.y - currentPoint.y;

                if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
                    map.panBy([dx, dy], { animate: false });
                }
            }
            animationFrameId = requestAnimationFrame(smoothDriftLoop);
        }

        async function changeLocation() {
            if (isUserControlling || isTransitioning) return;
            isTransitioning = true;

            locationNameEl.style.opacity = '0';

            let validName = null;
            let randomLoc;

            // Loop until we find a coordinate that successfully loads a real name and is unrestricted
            while (!validName && !isUserControlling) {
                randomLoc = locations[Math.floor(Math.random() * locations.length)];
                baseLat = randomLoc.lat;
                baseLng = randomLoc.lng;
                currentZoom = randomLoc.zoom;
                
                validName = await fetchRealLocationName(baseLat, baseLng);
            }

            if (isUserControlling) {
                isTransitioning = false;
                return;
            }

            driftTime = Math.random() * 50;

            // If first run, ensure world overview was seen, then fly into target location with quality sharpening
            const flyDuration = isFirstRun ? 2.5 : 1.8;
            isFirstRun = false;

            map.flyTo([baseLat, baseLng], currentZoom, {
                duration: flyDuration,
                easeLinearity: 0.15
            });

            map.once('moveend', () => {
                if (isUserControlling) {
                    isTransitioning = false;
                    return;
                }
                
                checkTileWashoutAndSkipIfNeeded();
                
                locationNameEl.innerText = validName;
                locationNameEl.style.opacity = '1';
                isTransitioning = false;
            });
        }

        function setupUserInteractions() {
            const userEvents = ['mousedown', 'touchstart', 'wheel', 'pointerdown'];
            
            userEvents.forEach(eventType => {
                map.on(eventType, () => {
                    if (!isUserControlling) {
                        isUserControlling = true;
                        controlHintEl.style.opacity = '1';
                        clearInterval(autoSwitchInterval);
                    }
                });
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    isUserControlling = false;
                    isTransitioning = false;
                    controlHintEl.style.opacity = '0';
                    changeLocation();
                    
                    clearInterval(autoSwitchInterval);
                    autoSwitchInterval = setInterval(changeLocation, 35000);
                }
            });
        }

        window.onload = async () => {
            initWakeLock();
            setupUserInteractions();
            
            // Wait briefly for world map overview tiles to render fully, then start the journey
            setTimeout(() => {
                changeLocation();
                autoSwitchInterval = setInterval(changeLocation, 35000);
                smoothDriftLoop();
            }, 1000);
        };
    </script>
</body>
</html>
