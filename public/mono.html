<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monochrome Controller</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col items-center justify-center p-6">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <div class="flex items-center space-x-3 mb-6">
            <div class="bg-indigo-600 p-2.5 rounded-xl text-white">
                <i class="fa-solid fa-moon text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg">Repo Monochrome Toggle</h1>
                <p class="text-xs text-slate-400">Controls monochrome.js activation</p>
            </div>
        </div>

        <div class="flex items-center justify-between p-4 bg-slate-950 rounded-xl border border-slate-800 mb-6">
            <div>
                <span class="font-medium text-sm block">Grayscale Filter</span>
                <span id="statusText" class="text-xs text-amber-400">Inactive</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
                <!-- Links to monochrome.js behavior -->
                <input type="checkbox" id="monoToggle" class="sr-only peer" onchange="triggerMonochromeScript(this.checked)">
                <div class="w-14 h-7 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[4px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-indigo-600"></div>
            </label>
        </div>

        <p class="text-xs text-slate-400 leading-relaxed text-center">
            This dashboard uses <code class="text-indigo-400">monochrome.js</code> to transform all repository views into high-contrast black and white.
        </p>
    </div>

    <!-- Import the separate code file -->
    <script src="monochrome.js"></script>
    <script>
        function triggerMonochromeScript(active) {
            const statusText = document.getElementById('statusText');
            // Re-evaluates or toggles the IIFE script effect
            const isCurrentlyActive = document.getElementById('repo-monochrome-global-style') !== null;
            
            if (active !== isCurrentlyActive) {
                // Dynamically load or remove script execution if toggle state desyncs
                if (active) {
                    const s = document.createElement('script');
                    s.src = 'monochrome.js';
                    document.body.appendChild(s);
                } else {
                    const existingStyle = document.getElementById('repo-monochrome-global-style');
                    if (existingStyle) existingStyle.remove();
                }
            }

            if (active) {
                statusText.textContent = 'Active (Black & White)';
                statusText.className = 'text-xs text-emerald-400 font-semibold';
            } else {
                statusText.textContent = 'Inactive';
                statusText.className = 'text-xs text-amber-400';
            }
        }
    </script>
</body>
</html>
