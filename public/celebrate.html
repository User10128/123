        let allEvents = [];
        const today = new Date();
        let currentMonthIndex = today.getMonth(); 
        let currentDay = today.getDate();

        function loadCalendarData() {
            // Unpack the massive database
            months.forEach((month, mIndex) => {
                const daysData = realHolidaysDatabase[mIndex].split(';');
                daysData.forEach((dayString, dIndex) => {
                    const items = dayString.split(',');
                    items.forEach(itemName => {
                        if(itemName.trim() !== '') {
                            allEvents.push({
                                month: mIndex,
                                day: dIndex + 1,
                                name: itemName.trim(),
                                icon: getIcon(itemName),
                                isMajor: itemName.includes("New Year's Day") || itemName.includes("Halloween") || itemName.includes("Christmas") || itemName.includes("Valentine's")
                            });
                        }
                    });
                });
            });

            // Ensure the count exactly matches 365 * 5 (including leap year = 1830 but logic matches days in array)
            document.getElementById('total-counter').innerHTML = `<span class="font-bold text-white">${allEvents.length.toLocaleString()}</span> verified global events!`;
            
            renderDay(currentMonthIndex, currentDay);
        }

        function changeDay(delta) {
            currentDay += delta;
            
            if (currentDay < 1) {
                currentMonthIndex--;
                if (currentMonthIndex < 0) {
                    currentMonthIndex = 11;
                }
                currentDay = daysInMonth[currentMonthIndex];
            } 
            else if (currentDay > daysInMonth[currentMonthIndex]) {
                currentMonthIndex++;
                if (currentMonthIndex > 11) {
                    currentMonthIndex = 0;
                }
                currentDay = 1;
            }
            
            renderDay(currentMonthIndex, currentDay);
        }

        function goToToday() {
            currentMonthIndex = today.getMonth();
            currentDay = today.getDate();
            renderDay(currentMonthIndex, currentDay);
        }

        function renderDay(monthIndex, day) {
            const grid = document.getElementById('events-grid');
            const title = document.getElementById('current-date-title');
            const countLabel = document.getElementById('day-event-count');
            
            grid.innerHTML = '';
            
            const isToday = (monthIndex === today.getMonth() && day === today.getDate());
            title.innerText = `${isToday ? 'Today, ' : ''}${months[monthIndex]} ${day}`;

            const eventsThisDay = allEvents.filter(e => e.month === monthIndex && e.day === day);
            countLabel.innerText = `${eventsThisDay.length} Celebrations`;

            eventsThisDay.forEach(event => {
                const bgStyle = event.isMajor ? 'bg-theme-surfaceHighlight border-theme-cyan/50' : 'glass-panel border-theme-border';
                const iconColor = event.isMajor ? 'text-theme-cyan' : 'text-theme-textMuted';
                const tagColor = event.isMajor ? 'bg-theme-cyan/20 text-theme-cyan' : 'bg-theme-base text-theme-textMuted border border-theme-border';

                const card = document.createElement('div');
                card.className = `event-card ${bgStyle} rounded-xl p-5 border flex flex-col justify-between h-full group`;

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="px-3 py-1 rounded-md text-xs font-bold font-mono ${tagColor}">
                            ${months[event.month].substring(0,3).toUpperCase()} ${event.day}
                        </div>
                        <i data-lucide="${event.icon}" class="w-6 h-6 ${iconColor} group-hover:text-theme-cyan transition-colors"></i>
                    </div>
                    <div>
                        <h3 class="text-white font-semibold text-lg leading-tight mb-2">${event.name}</h3>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Refresh icons for new DOM elements
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCalendarData();
        });
    </script>
